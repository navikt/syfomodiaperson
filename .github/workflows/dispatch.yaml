name: Deploy to dev-gcp

on:
  workflow_dispatch:
    inputs:
      gitCommit:
        description: "Complete git commit to deploy (leave blank for the latest commit on the selected branch)"
        required: false
        default: ""

jobs:
  deploy-dev:
    name: Deploy to NAIS Dev-gcp
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: navikt/isworkflows/.github/workflows/manual-deploy-dev.yml@master
    with:
      git-commit: ${{ github.event.inputs.gitCommit }}
      dev-cluster: dev-gcp
    secrets: inherit
